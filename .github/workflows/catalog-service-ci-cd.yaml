name: CI/CD Pipeline - Catalog Service

on:
  push:
    branches: [main, develop, megamart-shopcore]
    paths:
      - 'app/catalog-service/**'
      - 'gitops/environments/**/catalog-values-*.yaml'
      - '.github/workflows/catalog-service-ci-cd.yaml'
  pull_request:
    branches: [main, megamart-shopcore]
    paths:
      - 'app/catalog-service/**'
      - 'gitops/environments/**/catalog-values-*.yaml'
      - '.github/workflows/catalog-service-ci-cd.yaml'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: megamart-shopcore/catalog-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Catalog unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/catalog-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/catalog-service/package-lock.json
      - run: npm ci
      - run: npm run test:unit -- --coverage --runInBand

  sast:
    name: Catalog CodeQL analysis
    runs-on: ubuntu-latest
    needs: test
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript

  build-scan-push:
    name: Build, scan, and push Catalog image
    runs-on: ubuntu-latest
    needs: [test, sast]
    if: github.event_name == 'push'
    permissions:
      contents: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify AWS deployment prerequisites
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" >/dev/null || {
              echo "Missing ECR repository ${ECR_REPOSITORY}. Run the Deploy ShopCore Environment workflow first."
              exit 1
            }
          aws eks wait cluster-active \
            --name "${EKS_CLUSTER_NAME:-megamart-shopcore-dev}" \
            --region "${AWS_REGION}"
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./app/catalog-service
          target: production
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - run: |
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

      - name: Wait for ECR tag visibility
        run: |
          for attempt in {1..12}; do
            if aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids imageTag="${IMAGE_TAG}" \
              --region "${AWS_REGION}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for ECR tag ${IMAGE_TAG}"
          exit 1

  promote:
    name: Promote Catalog image in GitOps
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref_name == 'megamart-shopcore'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Update dev GitOps value
        run: |
          file=gitops/environments/dev/catalog-values-dev.yaml
          registry='${{ steps.login-ecr.outputs.registry }}'
          sed -i "s|repository:.*|repository: ${registry}/${ECR_REPOSITORY}|" "$file"
          sed -i "s|tag:.*|tag: ${IMAGE_TAG}|" "$file"
      - name: Commit promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add gitops/environments/dev/catalog-values-dev.yaml
          git diff --cached --quiet || git commit -m "chore(gitops): promote catalog image ${IMAGE_TAG} [skip ci]"
          git push origin "${GITHUB_REF_NAME}"
