apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-service.fullname" . }}-stable
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "order-service.selectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-service.fullname" . }}-canary
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "order-service.selectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
