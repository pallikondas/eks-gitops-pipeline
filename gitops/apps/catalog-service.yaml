apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-service-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    team: platform
spec:
  project: default
  source:
    repoURL: https://github.com/pallikondas/eks-gitops-pipeline
    targetRevision: megamart-shopcore
    path: helm/catalog-service
    helm:
      releaseName: catalog-service
      valueFiles:
        - ../../gitops/environments/dev/catalog-values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: catalog-service-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m