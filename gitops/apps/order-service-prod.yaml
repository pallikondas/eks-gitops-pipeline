apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-service-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: prod
    team: platform
spec:
  project: default
  source:
    repoURL: https://github.com/pallikondas/eks-gitops-pipeline
    targetRevision: megamart-shopcore
    path: helm/order-service
    helm:
      releaseName: order-service
      valueFiles:
        - ../../gitops/environments/prod/values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: order-service-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true