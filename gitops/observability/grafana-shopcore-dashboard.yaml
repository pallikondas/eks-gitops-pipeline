apiVersion: v1
kind: ConfigMap
metadata:
  name: shopcore-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  shopcore.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum(rate(order_service_http_requests_total[5m]))", "legendFormat": "orders", "refId": "A"}, {"expr": "sum(rate(catalog_service_http_requests_total[5m]))", "legendFormat": "catalog", "refId": "B"}],
          "title": "Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(order_service_http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "order p95", "refId": "A"}, {"expr": "histogram_quantile(0.95, sum(rate(catalog_service_http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "catalog p95", "refId": "B"}],
          "title": "Request Latency p95",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=~\"order-service-dev|catalog-service-dev\"}", "legendFormat": "{{namespace}}/{{horizontalpodautoscaler}}", "refId": "A"}],
          "title": "HPA Current Replicas",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"expr": "sum(kube_pod_status_ready{namespace=~\"order-service-dev|catalog-service-dev\", condition=\"true\"}) by (namespace)", "legendFormat": "{{namespace}} ready pods", "refId": "A"}],
          "title": "Application Health",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["megamart", "shopcore"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "title": "MegaMart ShopCore",
      "uid": "megamart-shopcore"
    }